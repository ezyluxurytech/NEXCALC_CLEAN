<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f7f4" />
    <meta name="description" content="A simple calculator with basic arithmetic and trigonometry." />
    <title>DELUX | Simple Calculator</title>
    <style>
      :root {
  color-scheme: light;
  --page: #f3f7f4;
  --ink: #182823;
  --muted: #77837d;
  --panel: #ffffff;
  --line: #e6ece8;
  --key: #f5f7f6;
  --key-hover: #eaf0ec;
  --green: #176b50;
  --green-soft: #e8f3ed;
  --coral: #c65f45;
  --shadow: 0 24px 70px rgba(30, 57, 43, 0.1);
}

* {
  box-sizing: border-box;
}

body {
  min-width: 320px;
  min-height: 100vh;
  margin: 0;
  background-color: var(--page);
  background-image: radial-gradient(#dce7df 0.7px, transparent 0.7px);
  background-size: 18px 18px;
  color: var(--ink);
  font-family: "Segoe UI", Tahoma, sans-serif;
  -webkit-font-smoothing: antialiased;
}

button {
  color: inherit;
  font: inherit;
}

.page-shell {
  display: flex;
  min-height: 100vh;
  flex-direction: column;
  align-items: center;
  padding: 28px 24px 20px;
}

.page-header,
.page-footer {
  display: flex;
  width: min(100%, 960px);
  align-items: center;
  justify-content: space-between;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  color: var(--ink);
  font-size: 17px;
  font-weight: 700;
  text-decoration: none;
}

.brand-mark {
  display: grid;
  width: 32px;
  aspect-ratio: 1;
  place-items: center;
  border-radius: 9px;
  background: var(--green);
  color: #fff;
  font-family: Georgia, serif;
  font-size: 19px;
}

.header-note,
.page-footer {
  color: var(--muted);
  font-size: 12px;
}

.calculator {
  width: min(100%, 420px);
  margin: auto 0;
  padding: 26px;
  border: 1px solid rgba(221, 231, 224, 0.9);
  border-radius: 8px;
  background: var(--panel);
  box-shadow: var(--shadow);
  animation: arrive 450ms ease-out both;
}

.calculator-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}

.eyebrow {
  margin: 0 0 5px;
  color: var(--green);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1.2px;
}

h1 {
  margin: 0;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 25px;
  font-weight: 400;
}

.angle-button {
  min-width: 54px;
  min-height: 38px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--green-soft);
  color: var(--green);
  cursor: pointer;
  font-size: 12px;
  font-weight: 800;
  transition: background 140ms ease, transform 140ms ease;
}

.angle-button:hover {
  background: #dcece2;
}

.angle-button:active,
.key:active {
  transform: translateY(1px);
}

.display {
  display: flex;
  min-height: 118px;
  flex-direction: column;
  justify-content: space-between;
  overflow: hidden;
  margin-bottom: 15px;
  padding: 15px 17px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #f8faf8;
  text-align: right;
}

.expression {
  min-height: 20px;
  overflow-x: auto;
  margin: 0;
  color: var(--muted);
  font-size: 14px;
  white-space: nowrap;
}

.result {
  overflow: hidden;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(32px, 9vw, 42px);
  line-height: 1.15;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.keypad {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 9px;
}

.key {
  min-width: 0;
  height: 54px;
  border: 1px solid transparent;
  border-radius: 6px;
  background: var(--key);
  cursor: pointer;
  font-size: 17px;
  font-weight: 600;
  transition: background 140ms ease, transform 140ms ease, border-color 140ms ease;
}

.key:hover {
  border-color: var(--line);
  background: var(--key-hover);
}

.key-utility {
  background: #f1f3f2;
  color: #59655f;
  font-size: 14px;
}

.key-function {
  background: var(--green-soft);
  color: var(--green);
  font-size: 15px;
}

.key-operator {
  background: #f8eee9;
  color: var(--coral);
  font-size: 20px;
}

.key-equals {
  background: var(--green);
  color: #fff;
  font-size: 22px;
}

.key-equals:hover {
  border-color: var(--green);
  background: #10583f;
}

.keyboard-note {
  margin: 15px 0 0;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.5;
  text-align: center;
}

.page-footer {
  justify-content: center;
  gap: 8px;
}

.page-footer span {
  color: var(--green);
}

button:focus-visible,
a:focus-visible {
  outline: 3px solid rgba(23, 107, 80, 0.35);
  outline-offset: 2px;
}

@keyframes arrive {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 480px) {
  .page-shell {
    min-height: 100svh;
    padding: max(12px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
  }

  .calculator {
    padding: 20px 16px;
  }

  .keypad {
    gap: 7px;
  }

  .key {
    height: 52px;
  }

  .angle-button {
    min-height: 44px;
  }

  button {
    touch-action: manipulation;
  }
}

@media (max-width: 360px) {
  body {
    min-width: 0;
  }

  .page-shell {
    padding-right: max(10px, env(safe-area-inset-right));
    padding-left: max(10px, env(safe-area-inset-left));
  }

  .calculator {
    padding: 16px 12px;
  }

  .display {
    padding: 12px;
  }

  .keypad {
    gap: 6px;
  }

  .key {
    height: 48px;
  }
}

@media (max-height: 500px) and (orientation: landscape) {
  .page-shell {
    padding-top: max(8px, env(safe-area-inset-top));
    padding-bottom: max(8px, env(safe-area-inset-bottom));
  }

  .calculator {
    padding-top: 14px;
    padding-bottom: 14px;
  }

  .calculator-heading {
    margin-bottom: 10px;
  }

  .display {
    min-height: 88px;
    margin-bottom: 10px;
  }

  .key {
    height: 44px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

    </style>
   
  </head>
  <body>
    <main class="page-shell">
      <section class="calculator" aria-label="Calculator">
        <div class="calculator-heading">
          
          <button class="angle-button" id="angle-mode" type="button" aria-label="Angle mode: degrees" aria-pressed="false">DEG</button>
        </div>

        <div class="display" aria-label="Calculator display">
          <p class="expression" id="expression" aria-live="polite">Enter a calculation</p>
          <output class="result" id="result" aria-live="assertive">0</output>
        </div>

        <div class="keypad" role="group" aria-label="Calculator keys">
          <button class="key key-utility" type="button" data-input="clear" aria-label="Clear">AC</button>
          <button class="key key-utility" type="button" data-input="backspace" aria-label="Backspace">DEL</button>
          <button class="key key-utility" type="button" data-input="(" aria-label="Open parenthesis">(</button>
          <button class="key key-operator" type="button" data-input=")" aria-label="Close parenthesis">)</button>

          <button class="key key-function" type="button" data-input="sin(" aria-label="Sine">sin</button>
          <button class="key key-function" type="button" data-input="cos(" aria-label="Cosine">cos</button>
          <button class="key key-function" type="button" data-input="tan(" aria-label="Tangent">tan</button>
          <button class="key key-operator" type="button" data-input="/" aria-label="Divide">÷</button>

          <button class="key" type="button" data-input="7">7</button>
          <button class="key" type="button" data-input="8">8</button>
          <button class="key" type="button" data-input="9">9</button>
          <button class="key key-operator" type="button" data-input="*" aria-label="Multiply">×</button>

          <button class="key" type="button" data-input="4">4</button>
          <button class="key" type="button" data-input="5">5</button>
          <button class="key" type="button" data-input="6">6</button>
          <button class="key key-operator" type="button" data-input="-" aria-label="Subtract">−</button>

          <button class="key" type="button" data-input="1">1</button>
          <button class="key" type="button" data-input="2">2</button>
          <button class="key" type="button" data-input="3">3</button>
          <button class="key key-operator" type="button" data-input="+" aria-label="Add">+</button>

          <span aria-hidden="true"></span>
          <button class="key" type="button" data-input="0">0</button>
          <button class="key" type="button" data-input=".">.</button>
          <button class="key key-equals" type="button" data-input="equals" aria-label="Calculate">=</button>
        </div>

       
      </section>
       <script >
        const expressionDisplay = document.querySelector('#expression');
const resultDisplay = document.querySelector('#result');
const angleButton = document.querySelector('#angle-mode');
const keypad = document.querySelector('.keypad');

let expression = '';
let lastResult = 0;
let angleMode = 'DEG';
let justEvaluated = false;

function tokenize(source) {
  const input = source.trim();
  const pattern = /\s*(?:(\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?|(sin|cos|tan)\b|([()+\-*/]))/gy;
  const tokens = [];
  let position = 0;

  while (position < input.length) {
    pattern.lastIndex = position;
    const match = pattern.exec(input);
    if (!match) throw new Error('Invalid expression');
    position = pattern.lastIndex;

    if (match[1]) {
      tokens.push({ type: 'number', value: Number(match[0].trim()) });
    } else if (match[2]) {
      tokens.push({ type: 'function', value: match[2].toLowerCase() });
    } else {
      tokens.push({ type: match[3], value: match[3] });
    }
  }

  return tokens;
}

function calculate(source) {
  const tokens = tokenize(source);
  let position = 0;

  function take(type) {
    if (tokens[position]?.type !== type) return false;
    position += 1;
    return true;
  }

  function expressionValue() {
    let value = term();
    while (tokens[position]?.type === '+' || tokens[position]?.type === '-') {
      const operator = tokens[position++].type;
      const right = term();
      value = operator === '+' ? value + right : value - right;
    }
    return value;
  }

  function term() {
    let value = unary();
    while (tokens[position]?.type === '*' || tokens[position]?.type === '/') {
      const operator = tokens[position++].type;
      const right = unary();
      if (operator === '/' && right === 0) throw new Error('Cannot divide by zero');
      value = operator === '*' ? value * right : value / right;
    }
    return value;
  }

  function unary() {
    if (take('+')) return unary();
    if (take('-')) return -unary();
    return primary();
  }

  function primary() {
    const token = tokens[position];
    if (!token) throw new Error('Incomplete expression');

    if (token.type === 'number') {
      position += 1;
      return token.value;
    }

    if (take('(')) {
      const value = expressionValue();
      if (!take(')')) throw new Error('Missing closing parenthesis');
      return value;
    }

    if (token.type === 'function') {
      position += 1;
      if (!take('(')) throw new Error('Expected an opening parenthesis');
      const argument = expressionValue();
      if (!take(')')) throw new Error('Missing closing parenthesis');
      const radians = angleMode === 'DEG' ? argument * Math.PI / 180 : argument;
      if (token.value === 'tan' && Math.abs(Math.cos(radians)) < 1e-12) {
        throw new Error('Tangent is undefined at this angle');
      }
      return Math[token.value](radians);
    }

    throw new Error('Invalid expression');
  }

  if (!tokens.length) throw new Error('Enter a calculation');
  const value = expressionValue();
  if (position !== tokens.length) throw new Error('Check the expression');
  if (!Number.isFinite(value)) throw new Error('Result is out of range');
  return Math.abs(value) < 1e-12 ? 0 : Number(value.toPrecision(12));
}

const format = value => String(value);

function updateDisplay(message = '') {
  expressionDisplay.textContent = expression || 'Enter a calculation';
  if (message) resultDisplay.textContent = message;
}

function appendInput(value) {
  if (justEvaluated) {
    if (/^[0-9.(]$/.test(value) || /^(sin|cos|tan)\(/.test(value)) {
      expression = '';
    } else {
      expression = format(lastResult);
    }
    justEvaluated = false;
  }

  if (expression.length + value.length > 100) return;
  expression += value;
  updateDisplay();
}

function backspace() {
  if (justEvaluated) justEvaluated = false;
  if (/(sin|cos|tan)\($/.test(expression)) {
    expression = expression.replace(/(sin|cos|tan)\($/, '');
  } else {
    expression = expression.slice(0, -1);
  }
  updateDisplay();
}

function runCalculation() {
  try {
    lastResult = calculate(expression);
    resultDisplay.textContent = format(lastResult);
    justEvaluated = true;
  } catch (error) {
    resultDisplay.textContent = 'Error';
  }
}

function clear() {
  expression = '';
  lastResult = 0;
  justEvaluated = false;
  resultDisplay.textContent = '0';
  updateDisplay();
}

const actions = { clear, backspace, equals: runCalculation };
const handleInput = value => actions[value] ? actions[value]() : appendInput(value);

keypad.addEventListener('click', event => {
  const button = event.target.closest('button[data-input]');
  if (button) handleInput(button.dataset.input);
});

angleButton.addEventListener('click', () => {
  angleMode = angleMode === 'DEG' ? 'RAD' : 'DEG';
  angleButton.textContent = angleMode;
  angleButton.setAttribute('aria-label', `Angle mode: ${angleMode === 'DEG' ? 'degrees' : 'radians'}`);
  angleButton.setAttribute('aria-pressed', String(angleMode === 'RAD'));
});

window.addEventListener('keydown', event => {
  const key = event.key.toLowerCase();
  const functionKeys = { s: 'sin(', c: 'cos(', t: 'tan(' };
  const input = /^[0-9.+\-*/()]$/.test(key) ? key : key === 'x' ? '*' : functionKeys[key];
  if (input) return event.preventDefault(), appendInput(input);
  const action = ['enter', '='].includes(key) ? runCalculation : key === 'backspace' ? backspace : key === 'escape' ? clear : null;
  if (action) {
    if (key !== 'escape') event.preventDefault();
    action();
  }
});

       </script>
  </body>
</html>
